
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            background: linear-gradient(135deg, #e8eaff, #f7f5ff);
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(40, 40, 100, 0.12);
        }

        .logo {
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            border-radius: 15px;
            background: #ecebff;
            color: #5145cd;
            font-size: 27px;
        }

        h1 {
            text-align: center;
            color: #22223b;
            font-size: 27px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #77778a;
            font-size: 14px;
            margin-bottom: 27px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #33334b;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #dcdce8;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #6257df;
            box-shadow: 0 0 0 3px rgba(98, 87, 223, 0.12);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 55px;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #6257df;
            cursor: pointer;
            font-size: 12px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 13px;
            margin-top: 5px;
            background: #594ee0;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button[type="submit"]:hover {
            background: #4438c7;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
        }

        .signin {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
            color: #77778a;
        }

        .signin a {
            color: #594ee0;
            text-decoration: none;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">🎓</div>

        <h1>Create Account</h1>
        <p class="subtitle">Register with your college details</p>

        <form id="registerForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">College Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="you@college.edu"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter 10-digit phone number"
                    inputmode="numeric"
                    maxlength="10"
                    pattern="[0-9]{10}"
                    autocomplete="tel"
                    title="Enter a 10-digit phone number"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Create Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="password"
                    >Show</button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>

                <div class="password-box">
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        data-target="confirmPassword"
                    >Show</button>
                </div>
            </div>

            <button type="submit">Create Account</button>

            <p id="message" role="status" aria-live="polite"></p>

        </form>

        <p class="signin">
            Already have an account?
            <a href="login.html">Sign in</a>
        </p>

    </div>

    <div id="final"></div>

    <script>
        const form = document.getElementById("registerForm");
        const password = document.getElementById("password");
        const confirmPassword = document.getElementById("confirmPassword");
        const message = document.getElementById("message");

        form.addEventListener("submit",async function(event) {
          event.preventDefault();
          const user={
            name:document.getElementById("name").value,
            email:document.getElementById("email").value,
            phone:document.getElementById("phone").value,
            pass1:document.getElementById("password").value,
            pass2:document.getElementById("confirmPassword").value
          };
          console.log(user);
          const response=await fetch("http://127.0.0.1:8000/login",{method:"POST",
            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(user)
          })
          console.log("Status code 200");
          const data=await response.json();
          if(response.ok){
            document.getElementById("final").textContent=data.data;
            document.getElementById("final").style.color="green";
            window.location.href='sign.html';
          }
          else{
            document.getElementById("final").textContent=data.detail
            document.getElementById("final").style.color="red"
          }
        })


        // Show or hide password
        document.querySelectorAll(".toggle-password").forEach(button => {
            button.addEventListener("click", function () {
                const field = document.getElementById(this.dataset.target);

                if (field.type === "password") {
                    field.type = "text";
                    this.textContent = "Hide";
                } else {
                    field.type = "password";
                    this.textContent = "Show";
                }
            });
        });

        // Check whether both passwords match
        function checkPasswords() {
            if (confirmPassword.value === "") {
                confirmPassword.setCustomValidity("");
                return;
            }

            if (password.value !== confirmPassword.value) {
                confirmPassword.setCustomValidity(
                    "Both passwords must match."
                );
            } else {
                confirmPassword.setCustomValidity("");
            }
        }

        password.addEventListener("input", checkPasswords);
        confirmPassword.addEventListener("input", checkPasswords);

        // Handle registration form submission
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            checkPasswords();

            if (!form.checkValidity()) {
                form.reportValidity();
                return;
            }

            message.style.color = "green";
            message.textContent =
                "Registration form validated successfully!";

            // This is only frontend validation.
            // Send the data to your backend to register the user.
        });

    </script>

</body>
</html>
